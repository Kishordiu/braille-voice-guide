<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto">
  <defs>
    <!-- Tactile Clay & Warm Espresso Gradients -->
    <radialGradient id="espressoVoid" cx="72%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241611" />
      <stop offset="45%" stop-color="#150E0B" />
      <stop offset="100%" stop-color="#090504" />
    </radialGradient>

    <!-- Warm Acoustic Gold Resonance Flare -->
    <radialGradient id="acousticGlow" cx="74%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#F2CC8F" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#814E3F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090504" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="terracottaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#814E3F" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#F2CC8F" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#E07A5F" stop-opacity="0.9" />
    </linearGradient>

    <!-- Dot Texture Matrix (Embossed Paper Mesh) -->
    <pattern id="paperGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.8" fill="#E07A5F" opacity="0.12" />
    </pattern>

    <!-- Keyframe Motion Animations -->
    <style>
      @keyframes brailleDotPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #E07A5F); }
        50% { transform: scale(1.18); filter: drop-shadow(0 0 16px #F2CC8F); }
      }
      @keyframes soundwaveWave {
        0%, 100% { height: 12px; transform: translateY(0); }
        50% { height: 46px; transform: translateY(-17px); }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0); opacity: 0.2; }
        50% { transform: translateY(110px); opacity: 0.85; }
        100% { transform: translateY(0); opacity: 0.2; }
      }
      @keyframes acousticRing {
        0% { r: 20px; opacity: 0.8; }
        100% { r: 120px; opacity: 0; }
      }

      .pin-1 { transform-origin: 700px 105px; animation: brailleDotPulse 3s ease-in-out infinite; }
      .pin-2 { transform-origin: 700px 150px; animation: brailleDotPulse 3s ease-in-out 0.4s infinite; }
      .pin-3 { transform-origin: 700px 195px; animation: brailleDotPulse 3s ease-in-out 0.8s infinite; }
      .pin-4 { transform-origin: 750px 105px; animation: brailleDotPulse 3s ease-in-out 1.2s infinite; }
      .pin-5 { transform-origin: 750px 150px; animation: brailleDotPulse 3s ease-in-out 1.6s infinite; }
      .pin-6 { transform-origin: 750px 195px; animation: brailleDotPulse 3s ease-in-out 2.0s infinite; }

      .wave-1 { animation: soundwaveWave 1.2s ease-in-out 0.1s infinite; }
      .wave-2 { animation: soundwaveWave 1.2s ease-in-out 0.25s infinite; }
      .wave-3 { animation: soundwaveWave 1.2s ease-in-out 0.4s infinite; }
      .wave-4 { animation: soundwaveWave 1.2s ease-in-out 0.55s infinite; }
      .wave-5 { animation: soundwaveWave 1.2s ease-in-out 0.7s infinite; }

      .laser-scanner { animation: scanBeam 4s ease-in-out infinite; }
      .acoustic-pulse { animation: acousticRing 3.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }

      .headline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist Sans", sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
        fill: #FFF7ED;
      }
      .mono-chip {
        font-family: "JetBrains Mono", Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Tactile Shell -->
  <rect width="960" height="320" rx="24" fill="url(#espressoVoid)" />
  <rect width="960" height="320" rx="24" fill="url(#paperGrid)" />
  <rect width="960" height="320" rx="24" fill="url(#acousticGlow)" />
  
  <!-- Outer Terracotta Clay Rim -->
  <rect x="2" y="2" width="956" height="316" rx="22" fill="none" stroke="url(#terracottaBorder)" stroke-width="1.8" />
  <path d="M 28 6 L 932 6" stroke="#FED7AA" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />

  <!-- ==================== 3D EMBOSSED BRAILLE CELL & ACOUSTIC HARMONICS ==================== -->

  <!-- Acoustic Waves Emanating from Voice Synthesis -->
  <circle cx="725" cy="150" r="30" fill="none" stroke="#E07A5F" stroke-width="1.2" class="acoustic-pulse" />
  <circle cx="725" cy="150" r="50" fill="none" stroke="#F2CC8F" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 6" />
  <circle cx="725" cy="150" r="85" fill="none" stroke="#E07A5F" stroke-width="0.6" opacity="0.3" stroke-dasharray="2 4" />

  <!-- The Tactile Braille Cell Plate (Embossed Plaque) -->
  <rect x="660" y="70" width="130" height="160" rx="16" fill="#1C120D" stroke="#814E3F" stroke-width="1.5" />
  <rect x="665" y="75" width="120" height="150" rx="12" fill="#291811" opacity="0.6" />

  <!-- Vertical Optical Scanner Laser Line -->
  <g class="laser-scanner">
    <line x1="660" y1="75" x2="790" y2="75" stroke="#F2CC8F" stroke-width="1.6" filter="drop-shadow(0 0 4px #E07A5F)" />
  </g>

  <!-- 6-Dot Braille Cell Pins (Active / Raised Representation for 'D-I-U') -->
  <!-- Col 1 -->
  <g class="pin-1">
    <circle cx="700" cy="105" r="12" fill="#E07A5F" stroke="#F2CC8F" stroke-width="2" />
    <circle cx="697" cy="102" r="3" fill="#FFF7ED" />
  </g>
  <g class="pin-2">
    <circle cx="700" cy="150" r="10" fill="#24140D" stroke="#814E3F" stroke-width="1.2" />
  </g>
  <g class="pin-3">
    <circle cx="700" cy="195" r="12" fill="#E07A5F" stroke="#F2CC8F" stroke-width="2" />
    <circle cx="697" cy="192" r="3" fill="#FFF7ED" />
  </g>
  <!-- Col 2 -->
  <g class="pin-4">
    <circle cx="750" cy="105" r="12" fill="#E07A5F" stroke="#F2CC8F" stroke-width="2" />
    <circle cx="747" cy="102" r="3" fill="#FFF7ED" />
  </g>
  <g class="pin-5">
    <circle cx="750" cy="150" r="12" fill="#E07A5F" stroke="#F2CC8F" stroke-width="2" />
    <circle cx="747" cy="152" r="3" fill="#FFF7ED" />
  </g>
  <g class="pin-6">
    <circle cx="750" cy="195" r="10" fill="#24140D" stroke="#814E3F" stroke-width="1.2" />
  </g>

  <!-- Right Oscillating Voice Equalizer Bars -->
  <g transform="translate(815, 150)">
    <rect x="0" y="-6" width="5" height="12" rx="2.5" fill="#E07A5F" class="wave-1" />
    <rect x="9" y="-6" width="5" height="12" rx="2.5" fill="#F2CC8F" class="wave-2" />
    <rect x="18" y="-6" width="5" height="12" rx="2.5" fill="#FFF7ED" class="wave-3" />
    <rect x="27" y="-6" width="5" height="12" rx="2.5" fill="#E07A5F" class="wave-4" />
    <rect x="36" y="-6" width="5" height="12" rx="2.5" fill="#F2CC8F" class="wave-5" />
  </g>

  <!-- Live Acoustic Speech Engine HUD Card -->
  <g transform="translate(635, 252)" class="mono-chip">
    <rect x="0" y="0" width="285" height="42" rx="10" fill="#140D0A" stroke="#814E3F" stroke-width="1" opacity="0.95" />
    <circle cx="14" cy="21" r="4" fill="#E07A5F" />
    <text x="26" y="19" fill="#F2CC8F" font-size="9.5" font-weight="700">VOICE SYNTHESIS: 24 kHz · NEURAL TTS</text>
    <text x="26" y="32" fill="#D6C4B8" font-size="8.5">6-DOT OPTICAL TRANSLATOR · ZERO LATENCY</text>
  </g>

  <!-- ==================== LEFT EDITORIAL & IDENTITY BLOCK ==================== -->
  <g transform="translate(52, 54)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#241611" stroke="#814E3F" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4.5" fill="#E07A5F" />
    <text x="28" y="18" fill="#F2CC8F" class="mono-chip" font-size="11" font-weight="700">ACCESSIBILITY · AUDIO-TACTILE</text>

    <text x="0" y="80" class="headline-text" font-size="44">BRAILLE VOICE GUIDE</text>

    <text x="0" y="122" fill="#FED7AA" font-size="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      Multi-Sensory Audio-Tactile Translation &amp; Optical Document Scanner
    </text>

    <!-- Warm Terracotta Accent Strip -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="40" height="3" fill="#E07A5F" rx="1.5" />
      <rect x="44" y="0" width="70" height="3" fill="#F2CC8F" rx="1.5" />
      <rect x="118" y="0" width="30" height="3" fill="#FFF7ED" rx="1.5" />
    </g>

    <!-- Tech Specs Badges -->
    <g transform="translate(0, 182)" class="mono-chip" font-size="10.5">
      <rect x="0" y="0" width="138" height="22" rx="6" fill="#1C120D" stroke="#45271F" stroke-width="1" />
      <text x="12" y="15" fill="#E07A5F">CLOUDFLARE EDGE</text>

      <rect x="148" y="0" width="128" height="22" rx="6" fill="#1C120D" stroke="#45271F" stroke-width="1" />
      <text x="160" y="15" fill="#F2CC8F">WEB AUDIO API</text>

      <rect x="286" y="0" width="120" height="22" rx="6" fill="#1C120D" stroke="#45271F" stroke-width="1" />
      <text x="298" y="15" fill="#FFF7ED">RADIX UI</text>
    </g>

    <g transform="translate(0, 230)">
      <text x="0" y="0" fill="#785044" class="mono-chip" font-size="9.5">
        DIU FOUNDRY · INCLUSIVE MULTI-SENSORY HARDWARE &amp; SOFTWARE INTERFACES
      </text>
    </g>
  </g>
</svg>